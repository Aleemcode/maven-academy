<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate · Maven Builder Academy</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/maven-mark-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="/app/assets/app.css">
<style>
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
.cert{position:relative;aspect-ratio:1.414/1;background:var(--paper);border:var(--bw) solid var(--forest);border-radius:6px;box-shadow:var(--sh-lg);padding:clamp(18px,4.2%,46px);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;container-type:inline-size}
.cert::before{content:"";position:absolute;inset:clamp(8px,1.4%,14px);border:2px solid var(--forest);border-radius:2px;pointer-events:none}
.cert .band{position:absolute;right:0;top:0;bottom:0;width:7.5%;background:var(--terra);border-left:var(--bw) solid var(--forest)}
.cert .band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(20,38,29,.16) 14px 16px)}
.c-top{display:flex;align-items:center;gap:2cqw;padding-right:9%}
.c-top img{height:6.2cqw;width:auto}
.c-top b{font-family:var(--disp);font-weight:800;font-size:2.4cqw;letter-spacing:-.02em;line-height:1}
.c-top small{display:block;font-family:var(--mono);font-weight:700;font-size:1.15cqw;letter-spacing:.18em;color:var(--terra-d);margin-top:.5cqw}
.c-mid{align-self:center;padding-right:9%}
.c-kick{font-family:var(--mono);font-weight:700;font-size:1.45cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--terra-d)}
.c-name{font-family:var(--disp);font-weight:800;font-size:clamp(28px,7.6cqw,96px);line-height:.95;letter-spacing:-.05em;margin:1.4cqw 0 1.8cqw;text-wrap:balance}
.c-body{font-size:clamp(12px,1.85cqw,22px);line-height:1.45;color:var(--ink-2);max-width:62ch}
.c-body b{color:var(--forest)}
.c-foot{display:grid;grid-template-columns:1fr 1fr;gap:4cqw;align-items:end;padding-right:9%}
.sig{border-top:2px solid var(--forest);padding-top:.9cqw}
.sig .hand{font-family:"Caveat",cursive;font-size:clamp(20px,3.6cqw,44px);line-height:1;color:var(--forest);margin-bottom:.4cqw}
.sig span{font-family:var(--mono);font-weight:700;font-size:1.15cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ver{text-align:right;font-family:var(--mono);font-size:1.15cqw;letter-spacing:.06em;color:var(--muted);line-height:1.6}
.ver b{display:block;color:var(--forest);font-size:1.6cqw;letter-spacing:.12em}
.status{max-width:560px;margin:40px auto;padding:26px 24px;text-align:center}
.status h1{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.03em;margin:10px 0 8px}
.status p{color:var(--ink-2)}
.verified{display:inline-flex;align-items:center;gap:8px;background:var(--ok-t);border:2px solid var(--forest);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14.5px}
.verified i{color:var(--ok);font-size:20px}
@media print{
  @page{size:A4 landscape;margin:0}
  .wrap{max-width:none;padding:0}
  .cert{box-shadow:none;border-radius:0;width:297mm;height:210mm;aspect-ratio:auto}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<script src="/assets/site-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/app/assets/maven.js"></script>
</head>
<body>
<header id="shell"></header>
<main class="wrap" id="main"></main>
<script>
(async function(){
  const { sb, boot, esc, fmt } = MAB;
  const code = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
  const main = document.getElementById("main");
  const longDate = d => fmt(d, { day: "numeric", month: "long", year: "numeric" });
  const verifyUrl = c => `${location.origin}/app/certificate?c=${encodeURIComponent(c)}`;

  function cert({ full_name, project_name, cohort, certified_at }, c) {
    return `<article class="cert" aria-label="Certificate of completion for ${esc(full_name)}"><i class="band" aria-hidden="true"></i>
      <div class="c-top"><img src="/assets/brand/maven-mark-dark.svg" alt=""><div><b>Maven Builder Academy</b><small>DESIGN MAVEN STUDIO</small></div></div>
      <div class="c-mid"><span class="c-kick">Certificate of completion</span><div class="c-name">${esc(full_name)}</div>
        <p class="c-body">completed the <b>Builder Intensive</b> (Cohort ${esc(cohort || 1)}): live sessions on AI fluency, design language, system thinking and shipping with taste, and presented${project_name ? ` <b>${esc(project_name)}</b>` : " their build"} at Demo Day.</p></div>
      <div class="c-foot"><div class="sig"><div class="hand">Aleem Akinyoola</div><span>Facilitator · ${esc(longDate(certified_at))}</span></div>
        <div class="ver">Verify this certificate<b>${esc(c)}</b>${esc(location.host)}/app/certificate</div></div></article>`;
  }

  if (code) {
    document.getElementById("shell").remove();
    const { data } = await sb.rpc("verify_certificate", { p_code: code });
    const row = (data || [])[0];
    if (!row) { main.innerHTML = `<div class="card status"><img src="/assets/brand/maven-mark-dark.svg" alt="" style="height:40px"><h1>No certificate with that code</h1><p>Check the code and try again.</p></div>`; return; }
    main.innerHTML = `<span class="verified"><i class="ph-fill ph-seal-check"></i>Verified by Maven Builder Academy</span><div style="height:18px"></div>${cert(row, code)}`;
    return;
  }

  const { me } = await boot({ page: "cert" });
  if (!me.certified_at || !me.cert_code) {
    main.innerHTML = `<div class="card status rise"><i class="ph ph-lock-simple" style="font-size:40px"></i><h1>Your certificate unlocks on Demo Day</h1><p>Present your build at Demo Day and Aleem will mark it presented. Your certificate appears here straight after.</p><div style="margin-top:18px"><a class="btn pri" href="/app"><i class="ph ph-house"></i>Back to home</a></div></div>`;
    return;
  }
  const { data: proj } = await sb.rpc("my_project");
  const row = { full_name: me.full_name, project_name: (proj || [])[0]?.project_name, cohort: me.cohort, certified_at: me.certified_at };
  const share = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(verifyUrl(me.cert_code))}`;
  main.innerHTML = `<span class="kick">Well built, ${esc(MAB.first(me.full_name))}</span><h1 class="hello">Your certificate</h1>
    <div class="tools no-print"><button class="btn pri" type="button" id="print"><i class="ph ph-download-simple"></i>Save as PDF</button><a class="btn" href="${share}" target="_blank" rel="noopener"><i class="ph ph-linkedin-logo"></i>Share on LinkedIn</a><button class="btn" type="button" id="copy"><i class="ph ph-link"></i>Copy verify link</button></div>
    ${cert(row, me.cert_code)}`;
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(verifyUrl(me.cert_code)); MAB.toast("Verify link copied"); } catch (e) { MAB.toast(verifyUrl(me.cert_code)); } };
})();
</script>
</body>
</html>

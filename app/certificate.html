<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate · Maven Builder Academy</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/maven-mark-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="/app/assets/app.css">
<style>
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
/* The certificate is drawn at a fixed A4-landscape size (1123x794) and scaled to fit, so the download matches the screen exactly. */
.stage{position:relative;width:100%;overflow:hidden}
.cert{position:absolute;left:0;top:0;width:1123px;height:794px;transform-origin:0 0;background:#FFFDF7;color:#14261D;font-family:"Instrument Sans",system-ui,sans-serif;display:grid;grid-template-columns:1fr 318px;box-shadow:0 18px 40px rgba(20,38,29,.18)}
.cert .frame{position:absolute;inset:18px 336px 18px 18px;border:3px solid #14261D;pointer-events:none;z-index:2}
.cert .frame::after{content:"";position:absolute;inset:7px;border:1.5px solid #B8902F}
.cert .guil{position:absolute;left:18px;top:18px;width:769px;height:758px;pointer-events:none;z-index:0}
.c-main{position:relative;z-index:1}
.micro{position:absolute;left:40px;right:358px;bottom:32px;font:700 5.5px/1 "Space Mono",monospace;letter-spacing:.18em;color:#14261D;opacity:.55;white-space:nowrap;overflow:hidden;z-index:3}
.c-verwrap{display:flex;gap:14px;align-items:flex-end}
.qr{width:78px;height:78px;flex:none;image-rendering:pixelated}
.c-main{padding:62px 40px 54px 70px;display:flex;flex-direction:column;justify-content:space-between}
.c-brand{display:flex;align-items:center;gap:14px}
.c-brand img{height:52px;width:auto}
.c-brand b{display:block;font:800 25px/1 "Bricolage Grotesque",Georgia,serif;letter-spacing:-.02em}
.c-brand small{display:block;font:700 11.5px/1 "Space Mono",monospace;letter-spacing:.2em;color:#AD4F16;margin-top:7px}
.c-kick{font:700 14px/1 "Space Mono",monospace;letter-spacing:.26em;color:#AD4F16}
.c-pre{font-size:18px;color:#4A5A50;margin:22px 0 6px}
.c-name{font:800 84px/.95 "Bricolage Grotesque",Georgia,serif;letter-spacing:-.045em;margin:0 0 22px;max-width:680px}
.c-name{white-space:nowrap}
.c-body{font-size:18.5px;line-height:1.5;color:#3C4B42;max-width:600px;margin:0}
.c-body b{color:#14261D}
.c-link{display:inline-block;margin-top:14px;font:700 14px/1 "Space Mono",monospace;background:#D6E59A;border-radius:999px;padding:8px 14px;color:#14261D}
.c-foot{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:end}
.c-sig .hand{font:700 46px/1 "Caveat",cursive;color:#14261D;margin-bottom:6px}
.c-sig .line{border-top:2px solid #14261D;padding-top:9px;font:700 11.5px/1.5 "Space Mono",monospace;letter-spacing:.12em;color:#4A5A50}
.c-ver{font:700 11.5px/1.6 "Space Mono",monospace;letter-spacing:.1em;color:#4A5A50}
.c-ver b{display:block;font-size:19px;letter-spacing:.14em;color:#14261D}
.c-side{background:#14261D;color:#F4F0E5;padding:62px 46px 54px 36px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;position:relative}
.c-side .tag{font:700 12px/1 "Space Mono",monospace;letter-spacing:.22em;color:#D6E59A}
.c-side .yr{font:800 92px/.85 "Bricolage Grotesque",Georgia,serif;letter-spacing:-.05em;color:#D6E59A;margin-top:14px}
.c-side .yr small{display:block;font:700 13px/1.4 "Space Mono",monospace;letter-spacing:.18em;color:#C9D2C3;margin-top:12px}
.seal{display:block;width:236px;height:296px;align-self:center;margin:-6px 0 -18px}
.c-side ul{position:relative;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font:700 11.5px/1.2 "Space Mono",monospace;letter-spacing:.14em;color:#C9D2C3}
.c-side li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#D6E59A;margin-right:10px;vertical-align:1px}
.status{max-width:560px;margin:40px auto;padding:26px 24px;text-align:center}
.status h1{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.03em;margin:10px 0 8px}
.status p{color:var(--ink-2)}
.verified{display:inline-flex;align-items:center;gap:8px;background:var(--ok-t);border:2px solid var(--forest);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14.5px}
.verified i{color:var(--ok);font-size:20px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/assets/site-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/app/assets/db.js"></script>
<script src="/app/assets/maven.js"></script>
</head>
<body>
<header id="shell"></header>
<main class="wrap" id="main"></main>
<script>
(async function(){
  const { sb, boot, esc, fmt } = MAB;
  const pathCode = (location.pathname.match(/^\/verify\/([^\/?#]+)/) || [])[1];
  const code = decodeURIComponent(pathCode || new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
  const onVerify = /^\/verify/.test(location.pathname);
  const main = document.getElementById("main");
  const longDate = d => fmt(d, { day: "numeric", month: "long", year: "numeric" });
  const safeLink = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch (e) { return ""; } };
  const verifyUrl = c => `${location.origin}/verify/${encodeURIComponent(c)}`;
  const COHORTS = { 1: { dates: "24 October to 15 November 2026", short: "24 OCT – 15 NOV 2026", hours: 16 } };
  const shortLink = u => { try { const x = new URL(u); return (x.host + x.pathname).replace(/^www\./, "").replace(/\/$/, ""); } catch (e) { return ""; } };

  const host = u => { try { return new URL(u).host.replace(/^www\./, ""); } catch (e) { return ""; } };
  function cert({ full_name, project_name, link, cohort, certified_at, issued_at }, c) {
    const name = full_name || "Maven Builder", co = COHORTS[cohort || 1] || COHORTS[1], n = cohort || 1;
    const issued = issued_at || certified_at, yr = new Date(issued).getFullYear(), live = link ? shortLink(link) : "";
    return `<div class="stage" id="stage"><article class="cert" id="cert" aria-label="Certificate of completion for ${esc(name)}"><canvas class="guil" id="guil" width="1538" height="1516" aria-hidden="true"></canvas><i class="frame" aria-hidden="true"></i><div class="micro" aria-hidden="true">${("MAVEN BUILDER ACADEMY · CERTIFICATE OF COMPLETION · " + c + " · ").repeat(12)}</div>
      <div class="c-main">
        <div class="c-brand"><img src="/assets/brand/maven-mark-dark.svg" alt=""><div><b>Maven Builder Academy</b><small>BY DESIGN MAVEN STUDIO</small></div></div>
        <div>
          <span class="c-kick">CERTIFICATE OF COMPLETION</span>
          <p class="c-pre">This is to certify that</p>
          <h2 class="c-name" id="cName">${esc(name)}</h2>
          <p class="c-body">has successfully completed <b>Maven Builder Academy, Cohort ${esc(n)}</b>, held from ${esc(co.dates)} (${esc(co.hours)} hours of live instruction and guided building), and presented the capstone project${project_name ? ` <b>${esc(project_name)}</b>` : ""}, designed with taste and shipped to a live link, at Demo Day.</p>
          ${live ? `<span class="c-link">${esc(live)}</span>` : ""}
        </div>
        <div class="c-foot">
          <div class="c-sig"><div class="hand">Aleem Akinyoola</div><div class="line">FOUNDER &amp; LEAD FACILITATOR</div></div>
          <div class="c-verwrap"><canvas class="qr" id="qr" width="312" height="312" aria-label="QR code that opens the verification page"></canvas><div class="c-ver">CERTIFICATE ID<b>${esc(c)}</b>ISSUED ${esc(longDate(issued).toUpperCase())}<br>VERIFY: ${esc(location.host.replace(/^www\./, "").toUpperCase())}/VERIFY</div></div>
        </div>
      </div>
      <aside class="c-side">
        <div><span class="tag">COHORT ${esc(n)} · DEMO DAY</span><div class="yr">${yr}<small>${esc(co.short)}<br>${esc(co.hours)} HOURS</small></div></div>
        <canvas class="seal" id="seal" width="708" height="888" role="img" aria-label="Gold seal: Maven Builder Academy, certificate of completion, verified, Cohort ${esc(n)}, ${yr}"></canvas>
        <div><span class="tag" style="display:block;margin-bottom:12px">PROGRAMME COVERED</span><ul><li>AI FLUENCY</li><li>DESIGN LANGUAGE</li><li>SYSTEM THINKING</li><li>PROTOTYPING</li><li>DEPLOYMENT</li></ul></div>
      </aside></article></div>`;
  }
  // ---- the seal, guilloche and QR are drawn on canvas so the download matches the screen exactly ----
  function goldGrad(g, x0, y0, x1, y1) {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    [[0, "#7A5A16"], [.18, "#D9B45A"], [.34, "#F7E7A6"], [.5, "#B98C2C"], [.68, "#F2D987"], [.84, "#A27A22"], [1, "#6E5014"]].forEach(([o, c]) => gr.addColorStop(o, c));
    return gr;
  }
  function drawSeal(cv, { yr, cohort, mark }) {
    const g = cv.getContext("2d"), W = cv.width, k = W / 236, cx = W / 2, cy = 118 * k, R = 104 * k;
    g.clearRect(0, 0, cv.width, cv.height);
    // ribbons
    const ribbon = (dir) => {
      g.save(); g.translate(cx, cy); g.rotate(dir * 0.32);
      const w = 30 * k, L = 168 * k;
      const rg = g.createLinearGradient(-w, 0, w, 0); rg.addColorStop(0, "#9E4612"); rg.addColorStop(.5, "#E8722C"); rg.addColorStop(1, "#A84C15");
      g.fillStyle = rg; g.beginPath(); g.moveTo(-w, 0); g.lineTo(w, 0); g.lineTo(w, L); g.lineTo(0, L - 22 * k); g.lineTo(-w, L); g.closePath(); g.fill();
      g.strokeStyle = "rgba(20,38,29,.35)"; g.lineWidth = 1.2 * k; g.stroke();
      g.strokeStyle = "rgba(247,231,166,.55)"; g.lineWidth = 1 * k; g.beginPath(); g.moveTo(-w + 5 * k, 0); g.lineTo(-w + 5 * k, L - 6 * k); g.moveTo(w - 5 * k, 0); g.lineTo(w - 5 * k, L - 6 * k); g.stroke();
      g.restore();
    };
    ribbon(1); ribbon(-1);
    // shadow under the rosette
    g.save(); g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = 14 * k; g.shadowOffsetY = 5 * k;
    // serrated rosette edge
    const N = 72; g.beginPath();
    for (let i = 0; i <= N * 2; i++) { const a = i / (N * 2) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? R * .935 : R; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    g.closePath(); g.fillStyle = goldGrad(g, cx - R, cy - R, cx + R, cy + R); g.fill(); g.restore();
    g.strokeStyle = "#6E5014"; g.lineWidth = 1 * k; g.stroke();
    // radial ridges (embossed foil)
    g.save(); g.beginPath(); g.arc(cx, cy, R * .9, 0, Math.PI * 2); g.clip();
    for (let i = 0; i < 180; i++) { const a = i / 180 * Math.PI * 2; g.strokeStyle = i % 2 ? "rgba(255,248,215,.18)" : "rgba(90,64,12,.16)"; g.lineWidth = 1.1 * k; g.beginPath(); g.moveTo(cx + Math.cos(a) * R * .66, cy + Math.sin(a) * R * .66); g.lineTo(cx + Math.cos(a) * R * .9, cy + Math.sin(a) * R * .9); g.stroke(); }
    g.restore();
    // rings
    const ring = (r, w, c) => { g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.strokeStyle = c; g.lineWidth = w; g.stroke(); };
    ring(R * .9, 2.2 * k, "#5E430F"); ring(R * .885, 1 * k, "rgba(255,246,210,.8)");
    // curved text band
    const txt = "MAVEN BUILDER ACADEMY ✦ CERTIFICATE OF COMPLETION ✦ ";
    g.save(); g.fillStyle = "#3A2A08"; g.font = `700 ${11.2 * k}px "Space Mono", monospace`; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `700 ${9.6 * k}px "Space Mono", monospace`;
    const rt = R * .775, chars = [...txt], step = Math.PI * 2 / chars.length;
    chars.forEach((ch, i) => { const a = -Math.PI / 2 + i * step; g.save(); g.translate(cx + Math.cos(a) * rt, cy + Math.sin(a) * rt); g.rotate(a + Math.PI / 2); g.fillText(ch, 0, 0); g.restore(); });
    g.restore();
    ring(R * .665, 2 * k, "#5E430F"); ring(R * .65, 1 * k, "rgba(255,246,210,.85)");
    // centre medallion: forest with gold type
    const cr = R * .62; const mg = g.createRadialGradient(cx - cr * .3, cy - cr * .4, cr * .1, cx, cy, cr); mg.addColorStop(0, "#22402F"); mg.addColorStop(1, "#0E1C14");
    g.beginPath(); g.arc(cx, cy, cr, 0, Math.PI * 2); g.fillStyle = mg; g.fill();
    ring(cr - 5 * k, 1 * k, "rgba(217,180,90,.7)");
    g.textAlign = "center"; g.textBaseline = "alphabetic";
    g.fillStyle = goldGrad(g, cx - cr, cy - cr, cx + cr, cy + cr);
    g.font = `700 ${8.4 * k}px "Space Mono", monospace`; g.fillText("COHORT " + (cohort || 1) + " · " + yr, cx, cy - 30 * k);
    if (mark) { // the Maven mark, foiled in gold
      const ms = 46 * k, off = document.createElement("canvas"); off.width = off.height = Math.ceil(ms);
      const o = off.getContext("2d"); const ar = (mark.naturalWidth || 1) / (mark.naturalHeight || 1); const mw = ar >= 1 ? ms : ms * ar, mh = ar >= 1 ? ms / ar : ms;
      o.drawImage(mark, (ms - mw) / 2, (ms - mh) / 2, mw, mh); o.globalCompositeOperation = "source-in"; o.fillStyle = goldGrad(o, 0, 0, ms, ms); o.fillRect(0, 0, ms, ms);
      g.drawImage(off, cx - ms / 2, cy - ms / 2 - 2 * k);
    } else { g.font = `800 ${30 * k}px "Bricolage Grotesque", Georgia, serif`; g.fillText("M", cx, cy + 10 * k); }
    g.font = `700 ${8.4 * k}px "Space Mono", monospace`; g.fillText("VERIFIED", cx, cy + 34 * k);
    // light sweep
    g.save(); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
    const sh = g.createLinearGradient(cx - R, cy - R, cx + R * .2, cy + R * .2); sh.addColorStop(0, "rgba(255,255,255,.22)"); sh.addColorStop(.45, "rgba(255,255,255,0)"); g.fillStyle = sh; g.fillRect(cx - R, cy - R, R * 2, R * 2); g.restore();
  }
  function drawGuilloche(cv) {
    const g = cv.getContext("2d"), s = cv.width / 769; g.clearRect(0, 0, cv.width, cv.height);
    const cx = 640 * s, cy = 600 * s; g.lineWidth = .6 * s;
    for (let j = 0; j < 3; j++) {
      g.strokeStyle = ["rgba(184,144,47,.10)", "rgba(20,38,29,.035)", "rgba(184,144,47,.07)"][j];
      const Rr = (150 + j * 46) * s, r = (17 + j * 5) * s, d = (60 + j * 14) * s;
      g.beginPath();
      for (let t = 0; t <= Math.PI * 2 * r / s; t += .012) { const x = (Rr - r) * Math.cos(t) + d * Math.cos((Rr - r) / r * t), y = (Rr - r) * Math.sin(t) - d * Math.sin((Rr - r) / r * t); g.lineTo(cx + x, cy + y); }
      g.stroke();
    }
  }
  function drawQR(cv, text) {
    if (!window.qrcode) { cv.remove(); return; }
    const q = qrcode(0, "M"); q.addData(text); q.make();
    const n = q.getModuleCount(), g = cv.getContext("2d"), m = cv.width / (n + 2);
    g.fillStyle = "#FFFDF7"; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = "#14261D";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect(Math.round((c + 1) * m), Math.round((r + 1) * m), Math.ceil(m), Math.ceil(m));
  }
  async function paint(row, c) {
    await document.fonts.ready;
    try { await Promise.all(['800 34px "Bricolage Grotesque"', '700 11px "Space Mono"'].map(f => document.fonts.load(f))); } catch (e) {}
    const nm = document.getElementById("cName");
    if (nm) { let fs = 84; nm.style.fontSize = fs + "px"; while (nm.scrollWidth > 660 && fs > 40) { fs -= 2; nm.style.fontSize = fs + "px"; } if (nm.scrollWidth > 660) { nm.style.whiteSpace = "normal"; } }
    const yr = new Date(row.certified_at).getFullYear();
    const mark = await new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = "/assets/brand/maven-mark-dark.svg"; });
    drawSeal(document.getElementById("seal"), { yr, cohort: row.cohort, mark });
    drawGuilloche(document.getElementById("guil"));
    drawQR(document.getElementById("qr"), verifyUrl(c));
  }
  function fit() {
    const st = document.getElementById("stage"), c = document.getElementById("cert"); if (!st || !c) return;
    const k = Math.min(1, st.clientWidth / 1123); c.style.transform = `scale(${k})`; st.style.height = (794 * k) + "px";
  }
  addEventListener("resize", fit);
  async function render() {
    await document.fonts.ready;
    const c = document.getElementById("cert");
    return html2canvas(c, { scale: 3, backgroundColor: "#FFFDF7", useCORS: true, onclone: d => { const x = d.getElementById("cert"); x.style.transform = "none"; x.style.boxShadow = "none"; } });
  }
  function saveBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  function wireDownloads(baseName) {
    const busy = (b, on, t) => { b.disabled = on; b.lastChild.textContent = t; };
    const pdf = document.getElementById("dlPdf"), png = document.getElementById("dlPng");
    pdf.onclick = async () => { busy(pdf, true, "Preparing…"); try { const cv = await render(); const doc = new jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" }); doc.addImage(cv.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 297, 210); doc.save(baseName + ".pdf"); } catch (e) { MAB.toast("Couldn’t make the PDF. Try the image."); } busy(pdf, false, "Download PDF"); };
    png.onclick = async () => { busy(png, true, "Preparing…"); try { const cv = await render(); cv.toBlob(b => saveBlob(b, baseName + ".png"), "image/png"); } catch (e) { MAB.toast("Couldn’t make the image."); } busy(png, false, "Download image"); };
  }
  const fileName = n => "maven-certificate-" + String(n || "builder").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  if (onVerify && !code) {
    document.getElementById("shell").remove();
    main.innerHTML = `<div class="card status"><img src="/assets/brand/maven-mark-dark.svg" alt="" style="height:40px"><h1>Verify a certificate</h1><p>Enter the certificate ID printed on a Maven Builder Academy certificate.</p>
      <form id="vf" style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center"><input class="in" id="vc" placeholder="MAB1-XXXXXX" aria-label="Certificate ID" style="max-width:240px;text-transform:uppercase"><button class="btn pri" type="submit">Verify</button></form></div>`;
    document.getElementById("vf").onsubmit = e => { e.preventDefault(); const v = document.getElementById("vc").value.trim(); if (v) location.href = "/verify/" + encodeURIComponent(v.toUpperCase()); };
    return;
  }
  if (code) {
    document.getElementById("shell").remove();
    const { data } = await sb.rpc("verify_certificate", { p_code: code });
    const row = (data || [])[0];
    if (!row) { main.innerHTML = `<div class="card status"><img src="/assets/brand/maven-mark-dark.svg" alt="" style="height:40px"><h1>No certificate with that code</h1><p>Check the code and try again.</p></div>`; return; }
    const live = safeLink(row.link);
    main.innerHTML = `<span class="verified"><i class="ph-fill ph-seal-check"></i>Verified by Maven Builder Academy</span>
      <p style="margin:14px 0 18px;color:var(--ink-2);max-width:70ch"><b style="color:var(--forest)">${esc(row.full_name)}</b> completed Maven Builder Academy, Cohort ${esc(row.cohort || 1)}. Certificate ${esc(code)}, issued ${esc(longDate(row.issued_at || row.certified_at))}.${live ? ` Capstone project: <a href="${esc(live)}" target="_blank" rel="noopener">${esc(row.project_name || shortLink(live))}</a>.` : ""}</p>${cert(row, code)}`;
    fit(); paint(row, code); return;
  }

  const { me } = await boot({ page: "cert" });
  if (!me.certified_at || !me.cert_code) {
    main.innerHTML = `<div class="card status rise"><i class="ph ph-lock-simple" style="font-size:40px"></i><h1>Your certificate unlocks after your demo</h1><p>Submit your demo from your home page. As soon as Aleem confirms it, your certificate appears here, ready to download.</p><div style="margin-top:18px"><a class="btn pri" href="/app"><i class="ph ph-house"></i>Back to home</a></div></div>`;
    return;
  }
  const { data: proj } = await sb.rpc("my_project");
  const p0 = (proj || [])[0] || {};
  const row = { full_name: me.cert_name || me.full_name, project_name: p0.project_name, link: p0.link, cohort: me.cohort, certified_at: me.certified_at, issued_at: p0.demo_submitted_at || me.certified_at };
  const share = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(verifyUrl(me.cert_code))}`;
  main.innerHTML = `<span class="kick">Well built, ${esc(MAB.first(me.full_name))}</span><h1 class="hello">Your certificate</h1>
    <div class="tools no-print"><button class="btn pri" type="button" id="dlPdf"><i class="ph ph-file-pdf"></i>Download PDF</button><button class="btn" type="button" id="dlPng"><i class="ph ph-image"></i>Download image</button><a class="btn" href="${share}" target="_blank" rel="noopener"><i class="ph ph-linkedin-logo"></i>Share on LinkedIn</a><button class="btn" type="button" id="copy"><i class="ph ph-link"></i>Copy verify link</button></div>
    ${cert(row, me.cert_code)}`;
  fit(); await paint(row, me.cert_code); wireDownloads(fileName(me.full_name));
  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(verifyUrl(me.cert_code)); MAB.toast("Verify link copied"); } catch (e) { MAB.toast(verifyUrl(me.cert_code)); } };
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate · Maven Builder Academy</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand/maven-mark-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="/app/assets/app.css">
<style>
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
/* The certificate is drawn at a fixed A4-landscape size (1123x794) and scaled to fit, so the download matches the screen exactly. */
.stage{position:relative;width:100%;overflow:hidden}
.cert{position:absolute;left:0;top:0;width:1123px;height:794px;transform-origin:0 0;background:#FFFDF7;color:#14261D;font-family:"Instrument Sans",system-ui,sans-serif;display:grid;grid-template-columns:1fr 318px;box-shadow:0 18px 40px rgba(20,38,29,.18)}
.cert .frame{position:absolute;inset:18px 336px 18px 18px;border:3px solid #14261D;pointer-events:none;z-index:2}
.cert .frame::after{content:"";position:absolute;inset:7px;border:1px solid #14261D;opacity:.35}
.c-main{padding:62px 40px 54px 70px;display:flex;flex-direction:column;justify-content:space-between}
.c-brand{display:flex;align-items:center;gap:14px}
.c-brand img{height:52px;width:auto}
.c-brand b{display:block;font:800 25px/1 "Bricolage Grotesque",Georgia,serif;letter-spacing:-.02em}
.c-brand small{display:block;font:700 11.5px/1 "Space Mono",monospace;letter-spacing:.2em;color:#AD4F16;margin-top:7px}
.c-kick{font:700 14px/1 "Space Mono",monospace;letter-spacing:.26em;color:#AD4F16}
.c-pre{font-size:18px;color:#4A5A50;margin:22px 0 6px}
.c-name{font:800 84px/.95 "Bricolage Grotesque",Georgia,serif;letter-spacing:-.045em;margin:0 0 22px;max-width:680px}
.c-name.long{font-size:64px}
.c-body{font-size:18.5px;line-height:1.5;color:#3C4B42;max-width:600px;margin:0}
.c-body b{color:#14261D}
.c-link{display:inline-block;margin-top:14px;font:700 14px/1 "Space Mono",monospace;background:#D6E59A;border-radius:999px;padding:8px 14px;color:#14261D}
.c-foot{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:end}
.c-sig .hand{font:700 46px/1 "Caveat",cursive;color:#14261D;margin-bottom:6px}
.c-sig .line{border-top:2px solid #14261D;padding-top:9px;font:700 11.5px/1.5 "Space Mono",monospace;letter-spacing:.12em;color:#4A5A50}
.c-ver{font:700 11.5px/1.6 "Space Mono",monospace;letter-spacing:.1em;color:#4A5A50}
.c-ver b{display:block;font-size:19px;letter-spacing:.14em;color:#14261D}
.c-side{background:#14261D;color:#F4F0E5;padding:62px 46px 54px 36px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;position:relative}
.c-side .tag{font:700 12px/1 "Space Mono",monospace;letter-spacing:.22em;color:#D6E59A}
.c-side .yr{font:800 92px/.85 "Bricolage Grotesque",Georgia,serif;letter-spacing:-.05em;color:#D6E59A;margin-top:14px}
.c-side .yr small{display:block;font:700 13px/1.4 "Space Mono",monospace;letter-spacing:.18em;color:#C9D2C3;margin-top:12px}
.seal{width:176px;height:176px;border-radius:50%;background:#E8722C;border:3px solid #F4F0E5;box-shadow:0 0 0 6px #14261D,0 0 0 8px #E8722C;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#14261D;align-self:center}
.seal i{font:700 10.5px/1 "Space Mono",monospace;letter-spacing:.2em;font-style:normal}
.seal b{font:800 30px/.95 "Bricolage Grotesque",Georgia,serif;letter-spacing:-.02em;margin:7px 0}
.c-side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font:700 11.5px/1.2 "Space Mono",monospace;letter-spacing:.14em;color:#C9D2C3}
.c-side li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#D6E59A;margin-right:10px;vertical-align:1px}
.status{max-width:560px;margin:40px auto;padding:26px 24px;text-align:center}
.status h1{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.03em;margin:10px 0 8px}
.status p{color:var(--ink-2)}
.verified{display:inline-flex;align-items:center;gap:8px;background:var(--ok-t);border:2px solid var(--forest);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14.5px}
.verified i{color:var(--ok);font-size:20px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/assets/site-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/app/assets/db.js"></script>
<script src="/app/assets/maven.js"></script>
</head>
<body>
<header id="shell"></header>
<main class="wrap" id="main"></main>
<script>
(async function(){
  const { sb, boot, esc, fmt } = MAB;
  const code = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
  const main = document.getElementById("main");
  const longDate = d => fmt(d, { day: "numeric", month: "long", year: "numeric" });
  const verifyUrl = c => `${location.origin}/app/certificate?c=${encodeURIComponent(c)}`;

  const host = u => { try { return new URL(u).host.replace(/^www\./, ""); } catch (e) { return ""; } };
  function cert({ full_name, project_name, link, cohort, certified_at }, c) {
    const name = full_name || "Maven Builder";
    const yr = new Date(certified_at).getFullYear();
    return `<div class="stage" id="stage"><article class="cert" id="cert" aria-label="Certificate of completion for ${esc(name)}"><i class="frame" aria-hidden="true"></i>
      <div class="c-main">
        <div class="c-brand"><img src="/assets/brand/maven-mark-dark.svg" alt=""><div><b>Maven Builder Academy</b><small>DESIGN MAVEN STUDIO</small></div></div>
        <div>
          <span class="c-kick">CERTIFICATE OF COMPLETION</span>
          <p class="c-pre">This certifies that</p>
          <h2 class="c-name${name.length > 18 ? " long" : ""}">${esc(name)}</h2>
          <p class="c-body">completed the <b>Builder Intensive</b>, Cohort ${esc(cohort || 1)}, and presented${project_name ? ` <b>${esc(project_name)}</b>` : " their build"} at Demo Day: a real product, designed with taste and shipped to a live link.</p>
          ${link && host(link) ? `<span class="c-link">${esc(host(link))}</span>` : ""}
        </div>
        <div class="c-foot">
          <div class="c-sig"><div class="hand">Aleem Akinyoola</div><div class="line">FACILITATOR · ${esc(longDate(certified_at).toUpperCase())}</div></div>
          <div class="c-ver">VERIFY AT ${esc(location.host.toUpperCase())}/APP/CERTIFICATE<b>${esc(c)}</b></div>
        </div>
      </div>
      <aside class="c-side">
        <div><span class="tag">COHORT ${esc(String(cohort || 1).padStart(2, "0"))} · DEMO DAY</span><div class="yr">${yr}<small>BUILDER<br>INTENSIVE</small></div></div>
        <div class="seal"><i>MAVEN</i><b>Shipped<br>with taste</b><i>CERTIFIED</i></div>
        <ul><li>AI FLUENCY</li><li>DESIGN LANGUAGE</li><li>SYSTEM THINKING</li><li>PROTOTYPE</li><li>GO LIVE</li></ul>
      </aside></article></div>`;
  }
  function fit() {
    const st = document.getElementById("stage"), c = document.getElementById("cert"); if (!st || !c) return;
    const k = Math.min(1, st.clientWidth / 1123); c.style.transform = `scale(${k})`; st.style.height = (794 * k) + "px";
  }
  addEventListener("resize", fit);
  async function render() {
    await document.fonts.ready;
    const c = document.getElementById("cert");
    return html2canvas(c, { scale: 3, backgroundColor: "#FFFDF7", useCORS: true, onclone: d => { const x = d.getElementById("cert"); x.style.transform = "none"; x.style.boxShadow = "none"; } });
  }
  function saveBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  function wireDownloads(baseName) {
    const busy = (b, on, t) => { b.disabled = on; b.lastChild.textContent = t; };
    const pdf = document.getElementById("dlPdf"), png = document.getElementById("dlPng");
    pdf.onclick = async () => { busy(pdf, true, "Preparing…"); try { const cv = await render(); const doc = new jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" }); doc.addImage(cv.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 297, 210); doc.save(baseName + ".pdf"); } catch (e) { MAB.toast("Couldn’t make the PDF. Try the image."); } busy(pdf, false, "Download PDF"); };
    png.onclick = async () => { busy(png, true, "Preparing…"); try { const cv = await render(); cv.toBlob(b => saveBlob(b, baseName + ".png"), "image/png"); } catch (e) { MAB.toast("Couldn’t make the image."); } busy(png, false, "Download image"); };
  }
  const fileName = n => "maven-certificate-" + String(n || "builder").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  if (code) {
    document.getElementById("shell").remove();
    const { data } = await sb.rpc("verify_certificate", { p_code: code });
    const row = (data || [])[0];
    if (!row) { main.innerHTML = `<div class="card status"><img src="/assets/brand/maven-mark-dark.svg" alt="" style="height:40px"><h1>No certificate with that code</h1><p>Check the code and try again.</p></div>`; return; }
    main.innerHTML = `<span class="verified"><i class="ph-fill ph-seal-check"></i>Verified by Maven Builder Academy</span><div style="height:18px"></div>${cert(row, code)}`;
    fit(); return;
  }

  const { me } = await boot({ page: "cert" });
  if (!me.certified_at || !me.cert_code) {
    main.innerHTML = `<div class="card status rise"><i class="ph ph-lock-simple" style="font-size:40px"></i><h1>Your certificate unlocks after your demo</h1><p>Submit your demo from your home page. As soon as Aleem confirms it, your certificate appears here, ready to download.</p><div style="margin-top:18px"><a class="btn pri" href="/app"><i class="ph ph-house"></i>Back to home</a></div></div>`;
    return;
  }
  const { data: proj } = await sb.rpc("my_project");
  const row = { full_name: me.full_name, project_name: (proj || [])[0]?.project_name, link: (proj || [])[0]?.link, cohort: me.cohort, certified_at: me.certified_at };
  const share = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(verifyUrl(me.cert_code))}`;
  main.innerHTML = `<span class="kick">Well built, ${esc(MAB.first(me.full_name))}</span><h1 class="hello">Your certificate</h1>
    <div class="tools no-print"><button class="btn pri" type="button" id="dlPdf"><i class="ph ph-file-pdf"></i>Download PDF</button><button class="btn" type="button" id="dlPng"><i class="ph ph-image"></i>Download image</button><a class="btn" href="${share}" target="_blank" rel="noopener"><i class="ph ph-linkedin-logo"></i>Share on LinkedIn</a><button class="btn" type="button" id="copy"><i class="ph ph-link"></i>Copy verify link</button></div>
    ${cert(row, me.cert_code)}`;
  fit(); wireDownloads(fileName(me.full_name));
  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(verifyUrl(me.cert_code)); MAB.toast("Verify link copied"); } catch (e) { MAB.toast(verifyUrl(me.cert_code)); } };
})();
</script>
</body>
</html>

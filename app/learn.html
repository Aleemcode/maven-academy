<body>
<header id="shell"></header>
<iframe id="learnFrame" title="Learn: the 18 tastes, demos and drills"></iframe>
<script>
(async function () {
  await MAB.boot({ page: "learn" });
  const f = document.getElementById("learnFrame");
  const fit = () => { f.style.height = Math.max(420, window.innerHeight - f.getBoundingClientRect().top) + "px"; };
  f.src = "/app/taste-lab/?embed=learn" + (location.hash || "");
  fit(); window.addEventListener("resize", fit);
})();
</script>
